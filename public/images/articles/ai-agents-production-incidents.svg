<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="Can AI Agents Be Trusted During Incidents?: Trust is an engineered property: scoped capabilities, independent gates and verification" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1426"/><stop offset="1" stop-color="#070d1a"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1536" height="1024" fill="url(#bg)"/><rect width="1536" height="6" fill="#f472b6"/><text x="768" y="92" font-size="60" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Can AI Agents Be Trusted <tspan fill="#f472b6">During Incidents?</tspan></text><text x="768" y="146" font-size="28" font-weight="400" fill="#9fb0d0" text-anchor="middle"><tspan x="768" dy="0">Trust is an engineered property: scoped capabilities, independent gates and verification</tspan></text><rect x="24" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="52" y="244" font-size="38" font-weight="800" fill="#34d399">1.</text><text x="96" y="242" font-size="30" font-weight="700" fill="#34d399" text-anchor="start"><tspan x="96" dy="0">Copilot: Low Risk</tspan></text><text x="96" y="284" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="96" dy="0">The agent summarizes alerts,</tspan><tspan x="96" dy="25">correlates logs and retrieves the</tspan><tspan x="96" dy="25">right runbook</tspan></text><rect x="52" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="112" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="112" dy="0">Alerts +</tspan><tspan x="112" dy="23">Logs</tspan></text><path d="M 176 444 H 192" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 188 437 L 202 444 L 188 451 Z" fill="#6b84b5"/><rect x="206" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="266" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="266" dy="0">Agent</tspan><tspan x="266" dy="23">Triage</tspan></text><path d="M 330 444 H 346" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 342 437 L 356 444 L 342 451 Z" fill="#34d399"/><rect x="360" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="420" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="420" dy="0">Human</tspan><tspan x="420" dy="23">Decides</tspan></text><rect x="52" y="524" width="429" height="152" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.45"/><rect x="52" y="524" width="6" height="152" rx="3" fill="#34d399"/><text x="78" y="582" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="78" dy="0">High leverage, read-only: faster</tspan><tspan x="78" dy="25">time-to-first-signal with humans in</tspan><tspan x="78" dy="25">control</tspan></text><rect x="525" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="553" y="244" font-size="38" font-weight="800" fill="#f87171">2.</text><text x="597" y="242" font-size="30" font-weight="700" fill="#f87171" text-anchor="start"><tspan x="597" dy="0">Direct Control: High</tspan><tspan x="597" dy="38">Risk</tspan></text><text x="597" y="322" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="597" dy="0">The agent executes remediation</tspan><tspan x="597" dy="25">itself, faster than a human can</tspan><tspan x="597" dy="25">stop a mistake</tspan></text><rect x="553" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="613" y="451" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="613" dy="0">Agent</tspan></text><path d="M 677 444 H 693" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 689 437 L 703 444 L 689 451 Z" fill="#6b84b5"/><rect x="707" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="767" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="767" dy="0">Wrong</tspan><tspan x="767" dy="23">Tool</tspan></text><path d="M 831 444 H 847" stroke="#f87171" stroke-width="3" fill="none"/><path d="M 843 437 L 857 444 L 843 451 Z" fill="#f87171"/><rect x="861" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#f87171" stroke-width="2" filter="url(#glow)"/><text x="921" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="921" dy="0">Prod</tspan><tspan x="921" dy="23">Change</tspan></text><rect x="553" y="524" width="429" height="152" rx="12" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.45"/><rect x="553" y="524" width="6" height="152" rx="3" fill="#f87171"/><text x="579" y="582" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="579" dy="0">Tool misbinding, hallucinated</tspan><tspan x="579" dy="25">config and prompt injection under</tspan><tspan x="579" dy="25">incident pressure</tspan></text><rect x="1026" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="1054" y="244" font-size="38" font-weight="800" fill="#34d399">3.</text><text x="1098" y="242" font-size="30" font-weight="700" fill="#34d399" text-anchor="start"><tspan x="1098" dy="0">Proposal Plus Gates</tspan></text><text x="1098" y="284" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="1098" dy="0">The agent prepares a diff;</tspan><tspan x="1098" dy="25">machine-checked gates and approval</tspan><tspan x="1098" dy="25">decide</tspan></text><rect x="1054" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="1114" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1114" dy="0">Proposed</tspan><tspan x="1114" dy="23">Diff</tspan></text><path d="M 1178 444 H 1194" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 1190 437 L 1204 444 L 1190 451 Z" fill="#6b84b5"/><rect x="1208" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="1268" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1268" dy="0">Policy</tspan><tspan x="1268" dy="23">Gates</tspan></text><path d="M 1332 444 H 1348" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 1344 437 L 1358 444 L 1344 451 Z" fill="#34d399"/><rect x="1362" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="1422" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1422" dy="0">Approved</tspan><tspan x="1422" dy="23">Action</tspan></text><rect x="1054" y="524" width="429" height="152" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.45"/><rect x="1054" y="524" width="6" height="152" rx="3" fill="#34d399"/><text x="1080" y="582" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="1080" dy="0">Least privilege, dry runs,</tspan><tspan x="1080" dy="25">preconditions and invariants, and a</tspan><tspan x="1080" dy="25">full audit trail</tspan></text><rect x="24" y="718" width="1488" height="284" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="56" y="772" font-size="32" font-weight="700" fill="#ffffff">A pragmatic adoption path</text><text x="56" y="808" font-size="21" font-weight="400" fill="#9fb0d0" text-anchor="start"><tspan x="56" dy="0">Expand autonomy only as gates prove precise; keep irreversible actions human-only</tspan></text><rect x="56" y="844" width="314" height="120" rx="14" fill="#121c31" stroke="#60a5fa" stroke-width="2"/><text x="213" y="896" font-size="22" font-weight="700" fill="#60a5fa" text-anchor="middle"><tspan x="213" dy="0">Read-only Copilot</tspan></text><text x="213" y="926" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="213" dy="0">Summarize and correlate</tspan></text><path d="M 378 904 H 408" stroke="#60a5fa" stroke-width="3" fill="none"/><path d="M 404 897 L 418 904 L 404 911 Z" fill="#60a5fa"/><rect x="426" y="844" width="314" height="120" rx="14" fill="#121c31" stroke="#60a5fa" stroke-width="2"/><text x="583" y="896" font-size="22" font-weight="700" fill="#60a5fa" text-anchor="middle"><tspan x="583" dy="0">Safe Diagnostics</tspan></text><text x="583" y="926" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="583" dy="0">Idempotent, non-destructive</tspan></text><path d="M 748 904 H 778" stroke="#fbbf24" stroke-width="3" fill="none"/><path d="M 774 897 L 788 904 L 774 911 Z" fill="#fbbf24"/><rect x="796" y="844" width="314" height="120" rx="14" fill="#121c31" stroke="#fbbf24" stroke-width="2"/><text x="953" y="896" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="middle"><tspan x="953" dy="0">Proposal + Gates</tspan></text><text x="953" y="926" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="953" dy="0">Diff, checks, approval</tspan></text><path d="M 1118 904 H 1148" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 1144 897 L 1158 904 L 1144 911 Z" fill="#34d399"/><rect x="1166" y="844" width="314" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="1323" y="896" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="1323" dy="0">Limited Autonomy</tspan></text><text x="1323" y="926" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="1323" dy="0">Narrow, reversible, audited</tspan></text></svg>