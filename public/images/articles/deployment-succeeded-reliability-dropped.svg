<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="The Deployment Succeeded. Reliability Dropped.: Deploy-time signals are proxies; users experience latency, errors and correctness" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1426"/><stop offset="1" stop-color="#070d1a"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1536" height="1024" fill="url(#bg)"/><rect width="1536" height="6" fill="#38bdf8"/><text x="768" y="92" font-size="50" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">The Deployment Succeeded. <tspan fill="#38bdf8">Reliability Dropped.</tspan></text><text x="768" y="146" font-size="28" font-weight="400" fill="#9fb0d0" text-anchor="middle"><tspan x="768" dy="0">Deploy-time signals are proxies; users experience latency, errors and correctness</tspan></text><rect x="24" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="52" y="244" font-size="38" font-weight="800" fill="#34d399">1.</text><text x="96" y="242" font-size="30" font-weight="700" fill="#34d399" text-anchor="start"><tspan x="96" dy="0">Pipeline Is Green</tspan></text><text x="96" y="284" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="96" dy="0">Build, tests, probes and the</tspan><tspan x="96" dy="25">rollout all report success</tspan></text><rect x="52" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="112" y="451" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="112" dy="0">CI Passed</tspan></text><path d="M 176 444 H 192" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 188 437 L 202 444 L 188 451 Z" fill="#6b84b5"/><rect x="206" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="266" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="266" dy="0">Rollout</tspan><tspan x="266" dy="23">Done</tspan></text><path d="M 330 444 H 346" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 342 437 L 356 444 L 342 451 Z" fill="#34d399"/><rect x="360" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="420" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="420" dy="0">Probes</tspan><tspan x="420" dy="23">Green</tspan></text><rect x="52" y="524" width="429" height="152" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.45"/><rect x="52" y="524" width="6" height="152" rx="3" fill="#34d399"/><text x="78" y="594" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="78" dy="0">&quot;Container is up&quot; is not the same</tspan><tspan x="78" dy="25">as &quot;ready under real load&quot;</tspan></text><rect x="525" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="553" y="244" font-size="38" font-weight="800" fill="#fbbf24">2.</text><text x="597" y="242" font-size="30" font-weight="700" fill="#fbbf24" text-anchor="start"><tspan x="597" dy="0">Hidden Amplifiers</tspan></text><text x="597" y="284" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="597" dy="0">Cold caches, retry storms, blocking</tspan><tspan x="597" dy="25">migrations and risky flags shift</tspan><tspan x="597" dy="25">the envelope</tspan></text><rect x="553" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="613" y="451" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="613" dy="0">Cold Pods</tspan></text><path d="M 677 444 H 693" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 689 437 L 703 444 L 689 451 Z" fill="#6b84b5"/><rect x="707" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="767" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="767" dy="0">Retries</tspan><tspan x="767" dy="23">x3</tspan></text><path d="M 831 444 H 847" stroke="#fbbf24" stroke-width="3" fill="none"/><path d="M 843 437 L 857 444 L 843 451 Z" fill="#fbbf24"/><rect x="861" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#fbbf24" stroke-width="2"/><text x="921" y="440" font-size="18" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="921" dy="0">DB</tspan><tspan x="921" dy="22">Contention</tspan></text><rect x="553" y="524" width="429" height="152" rx="12" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.45"/><rect x="553" y="524" width="6" height="152" rx="3" fill="#fbbf24"/><text x="579" y="582" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="579" dy="0">A tiny slowdown breaches timeouts;</tspan><tspan x="579" dy="25">retries multiply load with no</tspan><tspan x="579" dy="25">single failure</tspan></text><rect x="1026" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="1054" y="244" font-size="38" font-weight="800" fill="#f87171">3.</text><text x="1098" y="242" font-size="30" font-weight="700" fill="#f87171" text-anchor="start"><tspan x="1098" dy="0">Users Feel It</tspan></text><text x="1098" y="284" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="1098" dy="0">Latency and errors rise while every</tspan><tspan x="1098" dy="25">deploy check stays green</tspan></text><rect x="1054" y="394" width="197" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="1152" y="451" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1152" dy="0">Users</tspan></text><path d="M 1255 444 H 1271" stroke="#f87171" stroke-width="3" fill="none"/><path d="M 1267 437 L 1281 444 L 1267 451 Z" fill="#f87171"/><rect x="1285" y="394" width="197" height="100" rx="14" fill="#121c31" stroke="#f87171" stroke-width="2" filter="url(#glow)"/><text x="1384" y="451" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1384" dy="0">SLO Burn</tspan></text><rect x="1054" y="524" width="429" height="152" rx="12" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.45"/><rect x="1054" y="524" width="6" height="152" rx="3" fill="#f87171"/><text x="1080" y="594" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="1080" dy="0">The gap is between deploy success</tspan><tspan x="1080" dy="25">criteria and user-facing SLOs</tspan></text><rect x="24" y="718" width="1488" height="284" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="56" y="772" font-size="32" font-weight="700" fill="#ffffff">Make green mean good</text><text x="56" y="808" font-size="21" font-weight="400" fill="#9fb0d0" text-anchor="start"><tspan x="56" dy="0">Encode SLOs into the deployment process so success reflects what users experience</tspan></text><rect x="56" y="844" width="314" height="120" rx="14" fill="#121c31" stroke="#60a5fa" stroke-width="2"/><text x="213" y="896" font-size="22" font-weight="700" fill="#60a5fa" text-anchor="middle"><tspan x="213" dy="0">Load-aware Readiness</tspan></text><text x="213" y="926" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="213" dy="0">Pre-warm caches and pools</tspan></text><path d="M 378 904 H 408" stroke="#60a5fa" stroke-width="3" fill="none"/><path d="M 404 897 L 418 904 L 404 911 Z" fill="#60a5fa"/><rect x="426" y="844" width="314" height="120" rx="14" fill="#121c31" stroke="#60a5fa" stroke-width="2"/><text x="583" y="896" font-size="22" font-weight="700" fill="#60a5fa" text-anchor="middle"><tspan x="583" dy="0">Aligned Timeouts</tspan></text><text x="583" y="926" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="583" dy="0">Retry budgets with jitter</tspan></text><path d="M 748 904 H 778" stroke="#fbbf24" stroke-width="3" fill="none"/><path d="M 774 897 L 788 904 L 774 911 Z" fill="#fbbf24"/><rect x="796" y="844" width="314" height="120" rx="14" fill="#121c31" stroke="#fbbf24" stroke-width="2"/><text x="953" y="896" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="middle"><tspan x="953" dy="0">Staged Data Changes</tspan></text><text x="953" y="926" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="953" dy="0">Reversible migrations</tspan></text><path d="M 1118 904 H 1148" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 1144 897 L 1158 904 L 1144 911 Z" fill="#34d399"/><rect x="1166" y="844" width="314" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="1323" y="896" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="1323" dy="0">SLO-gated Canary</tspan></text><text x="1323" y="926" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="1323" dy="0">Auto-rollback on burn</tspan></text></svg>