x="613" dy="0">Noisy</tspan><tspan x="613" dy="23">Signal</tspan></text><path d="M 677 444 H 693" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 689 437 L 703 444 L 689 451 Z" fill="#6b84b5"/><rect x="707" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="767" y="451" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="767" dy="0">Script</tspan></text><path d="M 831 444 H 847" stroke="#f87171" stroke-width="3" fill="none"/><path d="M 843 437 L 857 444 L 843 451 Z" fill="#f87171"/><rect x="861" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#f87171" stroke-width="2" filter="url(#glow)"/><text x="921" y="440" font-size="18" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="921" dy="0">Fleet-wide</tspan><tspan x="921" dy="22">Restart</tspan></text><rect x="553" y="524" width="429" height="152" rx="12" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.45"/><rect x="553" y="524" width="6" height="152" rx="3" fill="#f87171"/><text x="579" y="582" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="579" dy="0">No preconditions, no limits:</tspan><tspan x="579" dy="25">automation acts during deploys and</tspan><tspan x="579" dy="25">amplifies incidents</tspan></text><rect x="1026" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="1054" y="244" font-size="38" font-weight="800" fill="#34d399">3.</text><text x="1098" y="242" font-size="30" font-weight="700" fill="#34d399" text-anchor="start"><tspan x="1098" dy="0">Guarded Controller</tspan></text><text x="1098" y="284" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="1098" dy="0">Sensors, policy, actuators and</tspan><tspan x="1098" dy="25">feedback with explicit safety</tspan><tspan x="1098" dy="25">checks</tspan></text><rect x="1054" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="1114" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1114" dy="0">Safety</tspan><tspan x="1114" dy="23">Checks</tspan></text><path d="M 1178 444 H 1194" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 1190 437 L 1204 444 L 1190 451 Z" fill="#6b84b5"/><rect x="1208" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="1268" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1268" dy="0">Bounded</tspan><tspan x="1268" dy="23">Action</tspan></text><path d="M 1332 444 H 1348" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 1344 437 L 1358 444 L 1344 451 Z" fill="#34d399"/><rect x="1362" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="1422" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1422" dy="0">Verify</tspan><tspan x="1422" dy="23">Outcome</tspan></text><rect x="1054" y="524" width="429" height="152" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.45"/><rect x="1054" y="524" width="6" height="152" rx="3" fill="#34d399"/><text x="1080" y="582" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="1080" dy="0">Thresholds over windows,</tspan><tspan x="1080" dy="25">hysteresis, rate limits, kill</tspan><tspan x="1080" dy="25">switch and narrow blast radius</tspan></text><rect x="24" y="718" width="1488" height="284" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="56" y="772" font-size="32" font-weight="700" fill="#ffffff">From narrative to safe automation</text><text x="56" y="808" font-size="21" font-weight="400" fill="#9fb0d0" text-anchor="start"><tspan x="56" dy="0">Write the guardrails first, then the behavior, and prove it before it touches production</tspan></text><rect x="56" y="844" width="314" height="120" rx="14" fill="#121c31" stroke="#60a5fa" stroke-width="2"/><text x="213" y="896" font-size="22" font-weight="700" fill="#60a5fa" text-anchor="middle"><tspan x="213" dy="0">Extract Decisions</tspan></text><text x="213" y="926" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="213" dy="0">Invariants and no-go conditions</tspan></text><path d="M 378 904 H 408" stroke="#60a5fa" stroke-width="3" fill="none"/><path d="M 404 897 L 418 904 L 404 911 Z" fill="#60a5fa"/><rect x="426" y="844" width="314" height="120" rx="14" fill="#121c31" stroke="#60a5fa" stroke-width="2"/><text x="583" y="896" font-size="22" font-weight="700" fill="#60a5fa" text-anchor="middle"><tspan x="583" dy="0">Shadow Mode</tspan></text><text x="583" y="926" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="583" dy="0">Decide, log, compare to humans</tspan></text><path d="M 748 904 H 778" stroke="#fbbf24" stroke-width="3" fill="none"/><path d="M 774 897 L 788 904 L 774 911 Z" fill="#fbbf24"/><rect x="796" y="844" width="314" height="120" rx="14" fill="#121c31" stroke="#fbbf24" stroke-width="2"/><text x="953" y="885" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="middle"><tspan x="953" dy="0">Canary Scope</tspan></text><text x="953" y="915" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="953" dy="0">One shard or zone, with kill</tspan><tspan x="953" dy="21">switch</tspan></text><path d="M 1118 904 H 1148" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 1144 897 L 1158 904 L 1144 911 Z" fill="#34d399"/><rect x="1166" y="844" width="314" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="1323" y="885" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="1323" dy="0">Progressive Rollout</tspan></text><text x="1323" y="915" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="1323" dy="0">Action rate tied to error</tspan><