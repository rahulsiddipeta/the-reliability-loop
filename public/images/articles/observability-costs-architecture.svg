<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="Observability Costs Are an Architecture Problem: Your diagram sets the telemetry bill; fix topology, volume, cardinality, and retention." font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1426"/><stop offset="1" stop-color="#070d1a"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1536" height="1024" fill="url(#bg)"/><rect width="1536" height="6" fill="#34d399"/><text x="768" y="92" font-size="50" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Observability Costs Are <tspan fill="#34d399">an Architecture Problem</tspan></text><text x="768" y="146" font-size="28" font-weight="400" fill="#9fb0d0" text-anchor="middle"><tspan x="768" dy="0">Your diagram sets the telemetry bill; fix topology, volume, cardinality, and retention.</tspan></text><rect x="24" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="52" y="244" font-size="38" font-weight="800" fill="#f87171">1.</text><text x="96" y="242" font-size="30" font-weight="700" fill="#f87171" text-anchor="start"><tspan x="96" dy="0">The vendor trap</tspan></text><text x="96" y="284" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="96" dy="0">Teams chase cheaper tools and</tspan><tspan x="96" dy="25">toggles; months later the spend</tspan><tspan x="96" dy="25">snaps back.</tspan></text><rect x="52" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="112" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="112" dy="0">Shop</tspan><tspan x="112" dy="23">vendors</tspan></text><path d="M 176 444 H 192" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 188 437 L 202 444 L 188 451 Z" fill="#6b84b5"/><rect x="206" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="266" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="266" dy="0">Tweak</tspan><tspan x="266" dy="23">limits</tspan></text><path d="M 330 444 H 346" stroke="#f87171" stroke-width="3" fill="none"/><path d="M 342 437 L 356 444 L 342 451 Z" fill="#f87171"/><rect x="360" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#f87171" stroke-width="2" filter="url(#glow)"/><text x="420" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="420" dy="0">Spend</tspan><tspan x="420" dy="23">drifts</tspan></text><rect x="52" y="524" width="429" height="152" rx="12" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.45"/><rect x="52" y="524" width="6" height="152" rx="3" fill="#f87171"/><text x="78" y="607" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="78" dy="0">Cost follows design, not contracts.</tspan></text><rect x="525" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="553" y="244" font-size="38" font-weight="800" fill="#fbbf24">2.</text><text x="597" y="242" font-size="30" font-weight="700" fill="#fbbf24" text-anchor="start"><tspan x="597" dy="0">Cost is in the</tspan><tspan x="597" dy="38">topology</tspan></text><text x="597" y="322" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="597" dy="0">Fan out, retries, and hot labels</tspan><tspan x="597" dy="25">multiply events and series before</tspan><tspan x="597" dy="25">queries begin.</tspan></text><rect x="553" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="613" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="613" dy="0">High fan</tspan><tspan x="613" dy="23">out</tspan></text><path d="M 677 444 H 693" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 689 437 L 703 444 L 689 451 Z" fill="#6b84b5"/><rect x="707" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="767" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="767" dy="0">Hot</tspan><tspan x="767" dy="23">labels</tspan></text><path d="M 831 444 H 847" stroke="#fbbf24" stroke-width="3" fill="none"/><path d="M 843 437 L 857 444 L 843 451 Z" fill="#fbbf24"/><rect x="861" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#fbbf24" stroke-width="2"/><text x="921" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="921" dy="0">Series</tspan><tspan x="921" dy="23">blowup</tspan></text><rect x="553" y="524" width="429" height="152" rx="12" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.45"/><rect x="553" y="524" width="6" height="152" rx="3" fill="#fbbf24"/><text x="579" y="594" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="579" dy="0">Every hop adds events and labels;</tspan><tspan x="579" dy="25">unbounded IDs explode series.</tspan></text><rect x="1026" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="1054" y="244" font-size="38" font-weight="800" fill="#34d399">3.</text><text x="1098" y="242" font-size="30" font-weight="700" fill="#34d399" text-anchor="start"><tspan x="1098" dy="0">Design the telemetry</tspan><tspan x="1098" dy="38">plane</tspan></text><text x="1098" y="322" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="1098" dy="0">Bound IDs, move sampling to source,</tspan><tspan x="1098" dy="25">derive metrics, and enforce</tspan><tspan x="1098" dy="25">budgets.</tspan></text><rect x="1054" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="1114" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1114" dy="0">Design</tspan><tspan x="1114" dy="23">plane</tspan></text><path d="M 1178 444 H 1194" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 1190 437 L 1204 444 L 1190 451 Z" fill="#6b84b5"/><rect x="1208" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="1268" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1268" dy="0">Bound</tspan><tspan x="1268" dy="23">labels</tspan></text><path d="M 1332 444 H 1348" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 1344 437 L 1358 444 L 1344 451 Z" fill="#34d399"/><rect x="1362" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="1422" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1422" dy="0">Source</tspan><tspan x="1422" dy="23">sample</tspan></text><rect x="1054" y="524" width="429" height="152" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.45"/><rect x="1054" y="524" width="6" height="152" rx="3" fill="#34d399"/><text x="1080" y="594" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="1080" dy="0">Align spend to value with upstream</tspan><tspan x="1080" dy="25">rules and outcome aware sampling.</tspan></text><rect x="24" y="718" width="1488" height="284" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="56" y="772" font-size="32" font-weight="700" fill="#ffffff">Turn the diagram into spend control</text><text x="56" y="808" font-size="21" font-weight="400" fill="#9fb0d0" text-anchor="start"><tspan x="56" dy="0">Trace costs to volume, cardinality, retention; set service budgets and pipeline SLAs.</tspan></text><rect x="56" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#60a5fa" stroke-width="2"/><text x="176" y="872" font-size="22" font-weight="700" fill="#60a5fa" text-anchor="middle"><tspan x="176" dy="0">Map fan out and</tspan><tspan x="176" dy="26">retries</tspan></text><text x="176" y="928" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="176" dy="0">Find where one request</tspan><tspan x="176" dy="21">turns into many.</tspan></text><path d="M 304 904 H 334" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 330 897 L 344 904 L 330 911 Z" fill="#34d399"/><rect x="352" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="472" y="872" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="472" dy="0">Cap hot label</tspan><tspan x="472" dy="26">space</tspan></text><text x="472" y="928" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="472" dy="0">Ban unbounded IDs on</tspan><tspan x="472" dy="21">hot series.</tspan></text><path d="M 600 904 H 630" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 626 897 L 640 904 L 626 911 Z" fill="#34d399"/><rect x="648" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="768" y="872" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="768" dy="0">Right size</tspan><tspan x="768" dy="26">volume</tspan></text><text x="768" y="928" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="768" dy="0">Summarize events; emit</tspan><tspan x="768" dy="21">off hot path.</tspan></text><path d="M 896 904 H 926" stroke="#60a5fa" stroke-width="3" fill="none"/><path d="M 922 897 L 936 904 L 922 911 Z" fill="#60a5fa"/><rect x="944" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#60a5fa" stroke-width="2"/><text x="1064" y="872" font-size="22" font-weight="700" fill="#60a5fa" text-anchor="middle"><tspan x="1064" dy="0">Tune retention</tspan><tspan x="1064" dy="26">tiers</tspan></text><text x="1064" y="928" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="1064" dy="0">Short hot tier; rollups</tspan><tspan x="1064" dy="21">or samples cold.</tspan></text><path d="M 1192 904 H 1222" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 1218 897 L 1232 904 L 1218 911 Z" fill="#34d399"/><rect x="1240" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="1360" y="873" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="1360" dy="0">Set budgets and</tspan><tspan x="1360" dy="26">SLAs</tspan></text><text x="1360" y="929" font-size="16" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="1360" dy="0">Define per service limits</tspan><tspan x="1360" dy="20">and failover SLAs.</tspan></text></svg>