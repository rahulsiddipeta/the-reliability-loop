<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="Platform Engineering vs. SRE Where Ownership Breaks: Explicit platform-SRE contracts and SLOs stop seam debt and make tension productive." font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1426"/><stop offset="1" stop-color="#070d1a"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1536" height="1024" fill="url(#bg)"/><rect width="1536" height="6" fill="#38bdf8"/><text x="768" y="92" font-size="50" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Platform Engineering vs. SRE <tspan fill="#38bdf8">Where Ownership Breaks</tspan></text><text x="768" y="146" font-size="28" font-weight="400" fill="#9fb0d0" text-anchor="middle"><tspan x="768" dy="0">Explicit platform-SRE contracts and SLOs stop seam debt and make tension productive.</tspan></text><rect x="24" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="52" y="244" font-size="38" font-weight="800" fill="#f87171">1.</text><text x="96" y="242" font-size="30" font-weight="700" fill="#f87171" text-anchor="start"><tspan x="96" dy="0">Where the Boundary</tspan><tspan x="96" dy="38">Fails</tspan></text><text x="96" y="322" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="96" dy="0">Blurred missions create seam debt:</tspan><tspan x="96" dy="25">upgrades collide, gates stall, and</tspan><tspan x="96" dy="25">no one owns incidents.</tspan></text><rect x="52" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="112" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="112" dy="0">Blurred</tspan><tspan x="112" dy="23">roles</tspan></text><path d="M 176 444 H 192" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 188 437 L 202 444 L 188 451 Z" fill="#6b84b5"/><rect x="206" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="266" y="451" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="266" dy="0">Seam debt</tspan></text><path d="M 330 444 H 346" stroke="#f87171" stroke-width="3" fill="none"/><path d="M 342 437 L 356 444 L 342 451 Z" fill="#f87171"/><rect x="360" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#f87171" stroke-width="2" filter="url(#glow)"/><text x="420" y="451" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="420" dy="0">No owner</tspan></text><rect x="52" y="524" width="429" height="152" rx="12" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.45"/><rect x="52" y="524" width="6" height="152" rx="3" fill="#f87171"/><text x="78" y="582" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="78" dy="0">Write the boundary or you inherit</tspan><tspan x="78" dy="25">outages from assumptions and</tspan><tspan x="78" dy="25">invisible queues.</tspan></text><rect x="525" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="553" y="244" font-size="38" font-weight="800" fill="#60a5fa">2.</text><text x="597" y="242" font-size="30" font-weight="700" fill="#60a5fa" text-anchor="start"><tspan x="597" dy="0">Missions and Time</tspan><tspan x="597" dy="38">Horizons</tspan></text><text x="597" y="322" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="597" dy="0">Platform serves devs with paved</tspan><tspan x="597" dy="25">paths; SRE owns user SLOs, error</tspan><tspan x="597" dy="25">budgets, and incidents.</tspan></text><rect x="553" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="613" y="428" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="613" dy="0">Platform</tspan><tspan x="613" dy="23">as</tspan><tspan x="613" dy="23">product</tspan></text><path d="M 677 444 H 693" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 689 437 L 703 444 L 689 451 Z" fill="#6b84b5"/><rect x="707" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="767" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="767" dy="0">SRE as</tspan><tspan x="767" dy="23">risk</tspan></text><path d="M 831 444 H 847" stroke="#60a5fa" stroke-width="3" fill="none"/><path d="M 843 437 L 857 444 L 843 451 Z" fill="#60a5fa"/><rect x="861" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#60a5fa" stroke-width="2"/><text x="921" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="921" dy="0">User</tspan><tspan x="921" dy="23">impact</tspan></text><rect x="553" y="524" width="429" height="152" rx="12" fill="#60a5fa" fill-opacity="0.08" stroke="#60a5fa" stroke-opacity="0.45"/><rect x="553" y="524" width="6" height="152" rx="3" fill="#60a5fa"/><text x="579" y="582" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="579" dy="0">Treat the platform like any</tspan><tspan x="579" dy="25">dependency, with SLIs, budgets, and</tspan><tspan x="579" dy="25">clear escalations.</tspan></text><rect x="1026" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="1054" y="244" font-size="38" font-weight="800" fill="#34d399">3.</text><text x="1098" y="242" font-size="30" font-weight="700" fill="#34d399" text-anchor="start"><tspan x="1098" dy="0">Contracts Make</tspan><tspan x="1098" dy="38">Tension Useful</tspan></text><text x="1098" y="322" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="1098" dy="0">Publish SLIs/SLOs, tie budgets to</tspan><tspan x="1098" dy="25">change policy, and predefine</tspan><tspan x="1098" dy="25">rollback and deprecation.</tspan></text><rect x="1054" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="1114" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1114" dy="0">SLIs and</tspan><tspan x="1114" dy="23">SLOs</tspan></text><path d="M 1178 444 H 1194" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 1190 437 L 1204 444 L 1190 451 Z" fill="#6b84b5"/><rect x="1208" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="1268" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1268" dy="0">Error</tspan><tspan x="1268" dy="23">budgets</tspan></text><path d="M 1332 444 H 1348" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 1344 437 L 1358 444 L 1344 451 Z" fill="#34d399"/><rect x="1362" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="1422" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1422" dy="0">Change</tspan><tspan x="1422" dy="23">policy</tspan></text><rect x="1054" y="524" width="429" height="152" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.45"/><rect x="1054" y="524" width="6" height="152" rx="3" fill="#34d399"/><text x="1080" y="594" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="1080" dy="0">Good fences are paved paths plus</tspan><tspan x="1080" dy="25">testable contracts and shared KPIs.</tspan></text><rect x="24" y="718" width="1488" height="284" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="56" y="772" font-size="32" font-weight="700" fill="#ffffff">How to make the boundary real and durable</text><text x="56" y="808" font-size="21" font-weight="400" fill="#9fb0d0" text-anchor="start"><tspan x="56" dy="0">Turn blurred goodwill into productized contracts, shared SLIs, and budgeted change.</tspan></text><rect x="56" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="176" y="872" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="176" dy="0">Define the</tspan><tspan x="176" dy="26">contract</tspan></text><text x="176" y="928" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="176" dy="0">APIs, change rules,</tspan><tspan x="176" dy="21">SLIs, deprecations.</tspan></text><path d="M 304 904 H 334" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 330 897 L 344 904 L 330 911 Z" fill="#34d399"/><rect x="352" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="472" y="872" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="472" dy="0">Publish platform</tspan><tspan x="472" dy="26">SLIs</tspan></text><text x="472" y="928" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="472" dy="0">SLOs for CI, deploys,</tspan><tspan x="472" dy="21">and control plane.</tspan></text><path d="M 600 904 H 630" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 626 897 L 640 904 L 626 911 Z" fill="#34d399"/><rect x="648" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="768" y="872" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="768" dy="0">Stitch budgets</tspan><tspan x="768" dy="26">to policy</tspan></text><text x="768" y="928" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="768" dy="0">Gate rollouts when deps</tspan><tspan x="768" dy="21">miss their SLOs.</tspan></text><path d="M 896 904 H 926" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 922 897 L 936 904 L 922 911 Z" fill="#34d399"/><rect x="944" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="1064" y="872" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="1064" dy="0">Pre-plan</tspan><tspan x="1064" dy="26">rollback power</tspan></text><text x="1064" y="928" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="1064" dy="0">Name decider, exit</tspan><tspan x="1064" dy="21">checks, and soak rules.</tspan></text><path d="M 1192 904 H 1222" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 1218 897 L 1232 904 L 1218 911 Z" fill="#34d399"/><rect x="1240" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="1360" y="872" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="1360" dy="0">Align cross-team</tspan><tspan x="1360" dy="26">KPIs</tspan></text><text x="1360" y="928" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="1360" dy="0">Join adoption with MTTR</tspan><tspan x="1360" dy="21">and budget burn.</tspan></text></svg>