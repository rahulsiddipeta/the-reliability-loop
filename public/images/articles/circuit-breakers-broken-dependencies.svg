<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="Circuit Breakers Don&#x27;t Fix Broken Dependencies: A breaker limits the blast radius of a failing dependency; it does not repair it" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1426"/><stop offset="1" stop-color="#070d1a"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1536" height="1024" fill="url(#bg)"/><rect width="1536" height="6" fill="#fbbf24"/><text x="768" y="92" font-size="50" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Circuit Breakers Don&#x27;t Fix <tspan fill="#fbbf24">Broken Dependencies</tspan></text><text x="768" y="146" font-size="28" font-weight="400" fill="#9fb0d0" text-anchor="middle"><tspan x="768" dy="0">A breaker limits the blast radius of a failing dependency; it does not repair it</tspan></text><rect x="24" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="52" y="244" font-size="38" font-weight="800" fill="#fbbf24">1.</text><text x="96" y="242" font-size="30" font-weight="700" fill="#fbbf24" text-anchor="start"><tspan x="96" dy="0">Dependency Degrades</tspan></text><text x="96" y="284" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="96" dy="0">The upstream slows down; callers</tspan><tspan x="96" dy="25">wait on long timeouts and threads</tspan><tspan x="96" dy="25">pile up</tspan></text><rect x="52" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="112" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="112" dy="0">Your</tspan><tspan x="112" dy="23">Service</tspan></text><path d="M 176 444 H 192" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 188 437 L 202 444 L 188 451 Z" fill="#6b84b5"/><rect x="206" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="266" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="266" dy="0">Client</tspan><tspan x="266" dy="23">Calls</tspan></text><path d="M 330 444 H 346" stroke="#fbbf24" stroke-width="3" fill="none"/><path d="M 342 437 L 356 444 L 342 451 Z" fill="#fbbf24"/><rect x="360" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#fbbf24" stroke-width="2"/><text x="420" y="440" font-size="18" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="420" dy="0">Slow</tspan><tspan x="420" dy="22">Dependency</tspan></text><rect x="52" y="524" width="429" height="152" rx="12" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.45"/><rect x="52" y="524" width="6" height="152" rx="3" fill="#fbbf24"/><text x="78" y="594" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="78" dy="0">Slow calls still count as successes</tspan><tspan x="78" dy="25">unless they exceed a deadline</tspan></text><rect x="525" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="553" y="244" font-size="38" font-weight="800" fill="#34d399">2.</text><text x="597" y="242" font-size="30" font-weight="700" fill="#34d399" text-anchor="start"><tspan x="597" dy="0">Breaker Opens</tspan></text><text x="597" y="284" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="597" dy="0">Failures cross the threshold; calls</tspan><tspan x="597" dy="25">are short-circuited and fail fast</tspan></text><rect x="553" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="613" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="613" dy="0">Your</tspan><tspan x="613" dy="23">Service</tspan></text><path d="M 677 444 H 693" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 689 437 L 703 444 L 689 451 Z" fill="#6b84b5"/><rect x="707" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="767" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="767" dy="0">Breaker:</tspan><tspan x="767" dy="23">Open</tspan></text><path d="M 831 444 H 847" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 843 437 L 857 444 L 843 451 Z" fill="#34d399"/><rect x="861" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="921" y="451" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="921" dy="0">Fallback</tspan></text><rect x="553" y="524" width="429" height="152" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.45"/><rect x="553" y="524" width="6" height="152" rx="3" fill="#34d399"/><text x="579" y="582" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="579" dy="0">Your capacity is protected:</tspan><tspan x="579" dy="25">threads, queues and tail latency</tspan><tspan x="579" dy="25">recover</tspan></text><rect x="1026" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="1054" y="244" font-size="38" font-weight="800" fill="#f87171">3.</text><text x="1098" y="242" font-size="30" font-weight="700" fill="#f87171" text-anchor="start"><tspan x="1098" dy="0">Dependency Still</tspan><tspan x="1098" dy="38">Broken</tspan></text><text x="1098" y="322" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="1098" dy="0">Half-open probes fail; nothing</tspan><tspan x="1098" dy="25">upstream has been repaired</tspan></text><rect x="1054" y="394" width="197" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="1152" y="451" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1152" dy="0">Half-open Probes</tspan></text><path d="M 1255 444 H 1271" stroke="#f87171" stroke-width="3" fill="none"/><path d="M 1267 437 L 1281 444 L 1267 451 Z" fill="#f87171"/><rect x="1285" y="394" width="197" height="100" rx="14" fill="#121c31" stroke="#f87171" stroke-width="2" filter="url(#glow)"/><text x="1384" y="451" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1384" dy="0">Same Bottleneck</tspan></text><rect x="1054" y="524" width="429" height="152" rx="12" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.45"/><rect x="1054" y="524" width="6" height="152" rx="3" fill="#f87171"/><text x="1080" y="582" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="1080" dy="0">Open breakers can mask degradation</tspan><tspan x="1080" dy="25">and synchronized probes can</tspan><tspan x="1080" dy="25">stampede recovery</tspan></text><rect x="24" y="718" width="1488" height="284" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="56" y="772" font-size="32" font-weight="700" fill="#ffffff">Containment plus a real fix</text><text x="56" y="808" font-size="21" font-weight="400" fill="#9fb0d0" text-anchor="start"><tspan x="56" dy="0">Use the breaker inside a larger pattern, then remediate the dependency itself</tspan></text><rect x="56" y="844" width="314" height="120" rx="14" fill="#121c31" stroke="#60a5fa" stroke-width="2"/><text x="213" y="896" font-size="22" font-weight="700" fill="#60a5fa" text-anchor="middle"><tspan x="213" dy="0">Deadlines</tspan></text><text x="213" y="926" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="213" dy="0">Bound work per call</tspan></text><path d="M 378 904 H 408" stroke="#60a5fa" stroke-width="3" fill="none"/><path d="M 404 897 L 418 904 L 404 911 Z" fill="#60a5fa"/><rect x="426" y="844" width="314" height="120" rx="14" fill="#121c31" stroke="#60a5fa" stroke-width="2"/><text x="583" y="896" font-size="22" font-weight="700" fill="#60a5fa" text-anchor="middle"><tspan x="583" dy="0">Concurrency Limits</tspan></text><text x="583" y="926" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="583" dy="0">Backpressure on in-flight calls</tspan></text><path d="M 748 904 H 778" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 774 897 L 788 904 L 774 911 Z" fill="#34d399"/><rect x="796" y="844" width="314" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="953" y="896" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="953" dy="0">Circuit Breaker</tspan></text><text x="953" y="926" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="953" dy="0">Fail fast on a known-bad path</tspan></text><path d="M 1118 904 H 1148" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 1144 897 L 1158 904 L 1144 911 Z" fill="#34d399"/><rect x="1166" y="844" width="314" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="1323" y="896" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="1323" dy="0">Fix the Dependency</tspan></text><text x="1323" y="926" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="1323" dy="0">Capacity, decoupling, caching</tspan></text></svg>