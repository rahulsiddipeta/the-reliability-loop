<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="When Kubernetes HPA Makes Incidents Worse: HPA&#x27;s loop can amplify incidents; choose sane signals, delays, and guardrails." font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1426"/><stop offset="1" stop-color="#070d1a"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1536" height="1024" fill="url(#bg)"/><rect width="1536" height="6" fill="#38bdf8"/><text x="768" y="92" font-size="60" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">When Kubernetes HPA Makes <tspan fill="#38bdf8">Incidents Worse</tspan></text><text x="768" y="146" font-size="28" font-weight="400" fill="#9fb0d0" text-anchor="middle"><tspan x="768" dy="0">HPA&#x27;s loop can amplify incidents; choose sane signals, delays, and guardrails.</tspan></text><rect x="24" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="52" y="244" font-size="38" font-weight="800" fill="#f87171">1.</text><text x="96" y="242" font-size="30" font-weight="700" fill="#f87171" text-anchor="start"><tspan x="96" dy="0">Scale-chasing latency</tspan></text><text x="96" y="284" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="96" dy="0">HPA sees high CPU, adds pods; cold</tspan><tspan x="96" dy="25">starts slow more; backlog grows;</tspan><tspan x="96" dy="25">loop escalates.</tspan></text><rect x="52" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="112" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="112" dy="0">Rising</tspan><tspan x="112" dy="23">latency</tspan></text><path d="M 176 444 H 192" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 188 437 L 202 444 L 188 451 Z" fill="#6b84b5"/><rect x="206" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="266" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="266" dy="0">More</tspan><tspan x="266" dy="23">replicas</tspan></text><path d="M 330 444 H 346" stroke="#f87171" stroke-width="3" fill="none"/><path d="M 342 437 L 356 444 L 342 451 Z" fill="#f87171"/><rect x="360" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#f87171" stroke-width="2" filter="url(#glow)"/><text x="420" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="420" dy="0">Warmup</tspan><tspan x="420" dy="23">storm</tspan></text><rect x="52" y="524" width="429" height="152" rx="12" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.45"/><rect x="52" y="524" width="6" height="152" rx="3" fill="#f87171"/><text x="78" y="594" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="78" dy="0">Cold pods worsen latency; tune warm</tspan><tspan x="78" dy="25">capacity and loop delay.</tspan></text><rect x="525" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="553" y="244" font-size="38" font-weight="800" fill="#f87171">2.</text><text x="597" y="242" font-size="30" font-weight="700" fill="#f87171" text-anchor="start"><tspan x="597" dy="0">Throttled scale-out</tspan></text><text x="597" y="284" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="597" dy="0">Low requests pump utilization; low</tspan><tspan x="597" dy="25">limits throttle pods; cluster grows</tspan><tspan x="597" dy="25">but work stalls.</tspan></text><rect x="553" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="613" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="613" dy="0">Low</tspan><tspan x="613" dy="23">request</tspan></text><path d="M 677 444 H 693" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 689 437 L 703 444 L 689 451 Z" fill="#6b84b5"/><rect x="707" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="767" y="451" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="767" dy="0">Low limit</tspan></text><path d="M 831 444 H 847" stroke="#f87171" stroke-width="3" fill="none"/><path d="M 843 437 L 857 444 L 843 451 Z" fill="#f87171"/><rect x="861" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#f87171" stroke-width="2" filter="url(#glow)"/><text x="921" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="921" dy="0">Throttled</tspan><tspan x="921" dy="23">pods</tspan></text><rect x="553" y="524" width="429" height="152" rx="12" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.45"/><rect x="553" y="524" width="6" height="152" rx="3" fill="#f87171"/><text x="579" y="594" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="579" dy="0">Align requests to baseline; avoid</tspan><tspan x="579" dy="25">tight CPU limits under load.</tspan></text><rect x="1026" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="1054" y="244" font-size="38" font-weight="800" fill="#34d399">3.</text><text x="1098" y="242" font-size="30" font-weight="700" fill="#34d399" text-anchor="start"><tspan x="1098" dy="0">Intentional</tspan><tspan x="1098" dy="38">autoscaling</tspan></text><text x="1098" y="322" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="1098" dy="0">Use stable signals, warm minima,</tspan><tspan x="1098" dy="25">gentle downscale, bounded upscale;</tspan><tspan x="1098" dy="25">respect delays.</tspan></text><rect x="1054" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="1114" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1114" dy="0">Sane</tspan><tspan x="1114" dy="23">signals</tspan></text><path d="M 1178 444 H 1194" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 1190 437 L 1204 444 L 1190 451 Z" fill="#6b84b5"/><rect x="1208" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="1268" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1268" dy="0">Warm</tspan><tspan x="1268" dy="23">minima</tspan></text><path d="M 1332 444 H 1348" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 1344 437 L 1358 444 L 1344 451 Z" fill="#34d399"/><rect x="1362" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="1422" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1422" dy="0">Bounded</tspan><tspan x="1422" dy="23">steps</tspan></text><rect x="1054" y="524" width="429" height="152" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.45"/><rect x="1054" y="524" width="6" height="152" rx="3" fill="#34d399"/><text x="1080" y="582" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="1080" dy="0">Pick metrics that match</tspan><tspan x="1080" dy="25">bottlenecks; set behavior windows</tspan><tspan x="1080" dy="25">to dampen swings.</tspan></text><rect x="24" y="718" width="1488" height="284" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="56" y="772" font-size="32" font-weight="700" fill="#ffffff">Guardrails to keep HPA calm in incidents</text><text x="56" y="808" font-size="21" font-weight="400" fill="#9fb0d0" text-anchor="start"><tspan x="56" dy="0">Turn a fragile loop into a stable one: fix signals, rightsize requests/limits, and add behavior damping.</tspan></text><rect x="56" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="176" y="872" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="176" dy="0">Rightsize CPU</tspan><tspan x="176" dy="26">requests</tspan></text><text x="176" y="928" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="176" dy="0">Match to steady use,</tspan><tspan x="176" dy="21">not wishful packing.</tspan></text><path d="M 304 904 H 334" stroke="#fbbf24" stroke-width="3" fill="none"/><path d="M 330 897 L 344 904 L 330 911 Z" fill="#fbbf24"/><rect x="352" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#fbbf24" stroke-width="2"/><text x="472" y="872" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="middle"><tspan x="472" dy="0">Avoid tight CPU</tspan><tspan x="472" dy="26">limits</tspan></text><text x="472" y="928" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="472" dy="0">Prevent CFS throttling</tspan><tspan x="472" dy="21">during real load.</tspan></text><path d="M 600 904 H 630" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 626 897 L 640 904 L 626 911 Z" fill="#34d399"/><rect x="648" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="768" y="872" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="768" dy="0">Stabilize</tspan><tspan x="768" dy="26">downscale</tspan></text><text x="768" y="928" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="768" dy="0">Keep warm pods; delay</tspan><tspan x="768" dy="21">and step down gently.</tspan></text><path d="M 896 904 H 926" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 922 897 L 936 904 L 922 911 Z" fill="#34d399"/><rect x="944" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="1064" y="872" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="1064" dy="0">Bound and pace</tspan><tspan x="1064" dy="26">scale-up</tspan></text><text x="1064" y="928" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="1064" dy="0">Cap jumps; respect</tspan><tspan x="1064" dy="21">startup and metric lag.</tspan></text><path d="M 1192 904 H 1222" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 1218 897 L 1232 904 L 1218 911 Z" fill="#34d399"/><rect x="1240" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="1360" y="872" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="1360" dy="0">Scale on per-pod</tspan><tspan x="1360" dy="26">rate</tspan></text><text x="1360" y="928" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="1360" dy="0">Prefer per-pod rate</tspan><tspan x="1360" dy="21">over raw backlog size.</tspan></text></svg>