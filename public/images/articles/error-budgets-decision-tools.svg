<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="Error Budgets Are Decision Tools: A budget should change what the team does next, not just what the dashboard shows" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1426"/><stop offset="1" stop-color="#070d1a"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1536" height="1024" fill="url(#bg)"/><rect width="1536" height="6" fill="#c084fc"/><text x="768" y="92" font-size="60" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Error Budgets Are <tspan fill="#c084fc">Decision Tools</tspan></text><text x="768" y="146" font-size="28" font-weight="400" fill="#9fb0d0" text-anchor="middle"><tspan x="768" dy="0">A budget should change what the team does next, not just what the dashboard shows</tspan></text><rect x="24" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="52" y="244" font-size="38" font-weight="800" fill="#34d399">1.</text><text x="96" y="242" font-size="30" font-weight="700" fill="#34d399" text-anchor="start"><tspan x="96" dy="0">Budget Healthy</tspan></text><text x="96" y="284" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="96" dy="0">Burn is slow and plenty of budget</tspan><tspan x="96" dy="25">remains for the window</tspan></text><rect x="52" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="112" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="112" dy="0">SLI vs</tspan><tspan x="112" dy="23">SLO</tspan></text><path d="M 176 444 H 192" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 188 437 L 202 444 L 188 451 Z" fill="#6b84b5"/><rect x="206" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="266" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="266" dy="0">Budget</tspan><tspan x="266" dy="23">80% Left</tspan></text><path d="M 330 444 H 346" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 342 437 L 356 444 L 342 451 Z" fill="#34d399"/><rect x="360" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="420" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="420" dy="0">Ship</tspan><tspan x="420" dy="23">Faster</tspan></text><rect x="52" y="524" width="429" height="152" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.45"/><rect x="52" y="524" width="6" height="152" rx="3" fill="#34d399"/><text x="78" y="582" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="78" dy="0">Spend surplus deliberately: riskier</tspan><tspan x="78" dy="25">releases, migrations and chaos</tspan><tspan x="78" dy="25">drills</tspan></text><rect x="525" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="553" y="244" font-size="38" font-weight="800" fill="#fbbf24">2.</text><text x="597" y="242" font-size="30" font-weight="700" fill="#fbbf24" text-anchor="start"><tspan x="597" dy="0">Burn Accelerating</tspan></text><text x="597" y="284" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="597" dy="0">Short and medium burn-rate windows</tspan><tspan x="597" dy="25">both cross their thresholds</tspan></text><rect x="553" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="613" y="451" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="613" dy="0">Fast Burn</tspan></text><path d="M 677 444 H 693" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 689 437 L 703 444 L 689 451 Z" fill="#6b84b5"/><rect x="707" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="767" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="767" dy="0">Release</tspan><tspan x="767" dy="23">Gate</tspan></text><path d="M 831 444 H 847" stroke="#fbbf24" stroke-width="3" fill="none"/><path d="M 843 437 L 857 444 L 843 451 Z" fill="#fbbf24"/><rect x="861" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#fbbf24" stroke-width="2"/><text x="921" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="921" dy="0">Rollouts</tspan><tspan x="921" dy="23">Paused</tspan></text><rect x="553" y="524" width="429" height="152" rx="12" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.45"/><rect x="553" y="524" width="6" height="152" rx="3" fill="#fbbf24"/><text x="579" y="582" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="579" dy="0">Pre-agreed gates stop the pipeline</tspan><tspan x="579" dy="25">by default instead of starting a</tspan><tspan x="579" dy="25">debate</tspan></text><rect x="1026" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="1054" y="244" font-size="38" font-weight="800" fill="#f87171">3.</text><text x="1098" y="242" font-size="30" font-weight="700" fill="#f87171" text-anchor="start"><tspan x="1098" dy="0">Budget Exhausted</tspan></text><text x="1098" y="284" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="1098" dy="0">Brakes engage and reliability work</tspan><tspan x="1098" dy="25">takes priority over features</tspan></text><rect x="1054" y="394" width="197" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="1152" y="451" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1152" dy="0">Budget Spent</tspan></text><path d="M 1255 444 H 1271" stroke="#f87171" stroke-width="3" fill="none"/><path d="M 1267 437 L 1281 444 L 1267 451 Z" fill="#f87171"/><rect x="1285" y="394" width="197" height="100" rx="14" fill="#121c31" stroke="#f87171" stroke-width="2" filter="url(#glow)"/><text x="1384" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1384" dy="0">Reliability</tspan><tspan x="1384" dy="23">First</tspan></text><rect x="1054" y="524" width="429" height="152" rx="12" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.45"/><rect x="1054" y="524" width="6" height="152" rx="3" fill="#f87171"/><text x="1080" y="582" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="1080" dy="0">If no decision ever changes when</tspan><tspan x="1080" dy="25">the budget moves, it is only a</tspan><tspan x="1080" dy="25">dashboard</tspan></text><rect x="24" y="718" width="1488" height="284" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="56" y="772" font-size="32" font-weight="700" fill="#ffffff">The reliability loop</text><text x="56" y="808" font-size="21" font-weight="400" fill="#9fb0d0" text-anchor="start"><tspan x="56" dy="0">Measure what users notice, set a target, and let the remaining budget drive policy</tspan></text><rect x="56" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#60a5fa" stroke-width="2"/><text x="176" y="896" font-size="22" font-weight="700" fill="#60a5fa" text-anchor="middle"><tspan x="176" dy="0">SLI</tspan></text><text x="176" y="926" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="176" dy="0">User-visible outcome</tspan></text><path d="M 304 904 H 334" stroke="#60a5fa" stroke-width="3" fill="none"/><path d="M 330 897 L 344 904 L 330 911 Z" fill="#60a5fa"/><rect x="352" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#60a5fa" stroke-width="2"/><text x="472" y="896" font-size="22" font-weight="700" fill="#60a5fa" text-anchor="middle"><tspan x="472" dy="0">SLO</tspan></text><text x="472" y="926" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="472" dy="0">Target over a window</tspan></text><path d="M 600 904 H 630" stroke="#fbbf24" stroke-width="3" fill="none"/><path d="M 626 897 L 640 904 L 626 911 Z" fill="#fbbf24"/><rect x="648" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#fbbf24" stroke-width="2"/><text x="768" y="896" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="middle"><tspan x="768" dy="0">Error Budget</tspan></text><text x="768" y="926" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="768" dy="0">Allowed unreliability</tspan></text><path d="M 896 904 H 926" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 922 897 L 936 904 L 922 911 Z" fill="#34d399"/><rect x="944" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="1064" y="896" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="1064" dy="0">Gates &amp; Brakes</tspan></text><text x="1064" y="926" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="1064" dy="0">Pre-agreed actions</tspan></text><path d="M 1192 904 H 1222" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 1218 897 L 1232 904 L 1218 911 Z" fill="#34d399"/><rect x="1240" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="1360" y="885" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="1360" dy="0">Backtest</tspan></text><text x="1360" y="915" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="1360" dy="0">Calibrate against</tspan><tspan x="1360" dy="21">history</tspan></text></svg>