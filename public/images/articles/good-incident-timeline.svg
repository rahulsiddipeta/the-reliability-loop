<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="The Anatomy of a Good Incident Timeline: A falsifiable, source-backed sequence that shows cause, choices, and effects." font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1426"/><stop offset="1" stop-color="#070d1a"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1536" height="1024" fill="url(#bg)"/><rect width="1536" height="6" fill="#c084fc"/><text x="768" y="92" font-size="60" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">The Anatomy of a Good Incident <tspan fill="#c084fc">Timeline</tspan></text><text x="768" y="146" font-size="28" font-weight="400" fill="#9fb0d0" text-anchor="middle"><tspan x="768" dy="0">A falsifiable, source-backed sequence that shows cause, choices, and effects.</tspan></text><rect x="24" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="52" y="244" font-size="38" font-weight="800" fill="#f87171">1.</text><text x="96" y="242" font-size="30" font-weight="700" fill="#f87171" text-anchor="start"><tspan x="96" dy="0">Chat log is not</tspan><tspan x="96" dy="38">timeline</tspan></text><text x="96" y="322" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="96" dy="0">Chats, alerts, and tickets become</tspan><tspan x="96" dy="25">the timeline, hiding cause, order,</tspan><tspan x="96" dy="25">and uncertainty.</tspan></text><rect x="52" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="112" y="451" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="112" dy="0">chat feed</tspan></text><path d="M 176 444 H 192" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 188 437 L 202 444 L 188 451 Z" fill="#6b84b5"/><rect x="206" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="266" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="266" dy="0">alert</tspan><tspan x="266" dy="23">stream</tspan></text><path d="M 330 444 H 346" stroke="#f87171" stroke-width="3" fill="none"/><path d="M 342 437 L 356 444 L 342 451 Z" fill="#f87171"/><rect x="360" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#f87171" stroke-width="2" filter="url(#glow)"/><text x="420" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="420" dy="0">ticket</tspan><tspan x="420" dy="23">queue</tspan></text><rect x="52" y="524" width="429" height="152" rx="12" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.45"/><rect x="52" y="524" width="6" height="152" rx="3" fill="#f87171"/><text x="78" y="594" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="78" dy="0">A tool echo log misorders events</tspan><tspan x="78" dy="25">and hardens bias.</tspan></text><rect x="525" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="553" y="244" font-size="38" font-weight="800" fill="#60a5fa">2.</text><text x="597" y="242" font-size="30" font-weight="700" fill="#60a5fa" text-anchor="start"><tspan x="597" dy="0">What a timeline is</tspan></text><text x="597" y="284" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="597" dy="0">A source-backed sequence ordered by</tspan><tspan x="597" dy="25">occurred_at, with uncertainty and</tspan><tspan x="597" dy="25">offsets explicit.</tspan></text><rect x="553" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="613" y="450" font-size="16" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="613" dy="0">occurred_at</tspan></text><path d="M 677 444 H 693" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 689 437 L 703 444 L 689 451 Z" fill="#6b84b5"/><rect x="707" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="767" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="767" dy="0">evidence</tspan><tspan x="767" dy="23">refs</tspan></text><path d="M 831 444 H 847" stroke="#60a5fa" stroke-width="3" fill="none"/><path d="M 843 437 L 857 444 L 843 451 Z" fill="#60a5fa"/><rect x="861" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#60a5fa" stroke-width="2"/><text x="921" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="921" dy="0">order</tspan><tspan x="921" dy="23">rule</tspan></text><rect x="553" y="524" width="429" height="152" rx="12" fill="#60a5fa" fill-opacity="0.08" stroke="#60a5fa" stroke-opacity="0.45"/><rect x="553" y="524" width="6" height="152" rx="3" fill="#60a5fa"/><text x="579" y="582" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="579" dy="0">Traceability over precision; anchor</tspan><tspan x="579" dy="25">to verifiable sources; keep UTC</tspan><tspan x="579" dy="25">canonical.</tspan></text><rect x="1026" y="182" width="485" height="520" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="1054" y="244" font-size="38" font-weight="800" fill="#34d399">3.</text><text x="1098" y="242" font-size="30" font-weight="700" fill="#34d399" text-anchor="start"><tspan x="1098" dy="0">The better approach</tspan></text><text x="1098" y="284" font-size="20" font-weight="400" fill="#b5c2d5" text-anchor="start"><tspan x="1098" dy="0">Use a small schema and taxonomy;</tspan><tspan x="1098" dy="25">blend sources; mark confidence;</tspan><tspan x="1098" dy="25">verify with durable refs.</tspan></text><rect x="1054" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="1114" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1114" dy="0">small</tspan><tspan x="1114" dy="23">schema</tspan></text><path d="M 1178 444 H 1194" stroke="#6b84b5" stroke-width="3" fill="none"/><path d="M 1190 437 L 1204 444 L 1190 451 Z" fill="#6b84b5"/><rect x="1208" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#4b6290" stroke-width="2"/><text x="1268" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1268" dy="0">typed</tspan><tspan x="1268" dy="23">entries</tspan></text><path d="M 1332 444 H 1348" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 1344 437 L 1358 444 L 1344 451 Z" fill="#34d399"/><rect x="1362" y="394" width="120" height="100" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="1422" y="439" font-size="19" font-weight="650" fill="#f4f7fc" text-anchor="middle"><tspan x="1422" dy="0">verify</tspan><tspan x="1422" dy="23">links</tspan></text><rect x="1054" y="524" width="429" height="152" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.45"/><rect x="1054" y="524" width="6" height="152" rx="3" fill="#34d399"/><text x="1080" y="582" font-size="20" font-weight="500" fill="#e6ecf7" text-anchor="start"><tspan x="1080" dy="0">Split decisions, actions, and state</tspan><tspan x="1080" dy="25">change; reconcile later with clear</tspan><tspan x="1080" dy="25">refs.</tspan></text><rect x="24" y="718" width="1488" height="284" rx="18" fill="#0f182b" stroke="#22324f" stroke-width="2"/><text x="56" y="772" font-size="32" font-weight="700" fill="#ffffff">Build a trustworthy incident timeline</text><text x="56" y="808" font-size="21" font-weight="400" fill="#9fb0d0" text-anchor="start"><tspan x="56" dy="0">From capture to audit: a path to falsifiable, source-backed, UTC-ordered timelines.</tspan></text><rect x="56" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="176" y="872" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="176" dy="0">Define the entry</tspan><tspan x="176" dy="26">schema</tspan></text><text x="176" y="928" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="176" dy="0">occurred_at UTC, actor,</tspan><tspan x="176" dy="21">type, summary</tspan></text><path d="M 304 904 H 334" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 330 897 L 344 904 L 330 911 Z" fill="#34d399"/><rect x="352" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="472" y="872" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="472" dy="0">Capture with</tspan><tspan x="472" dy="26">sources</tspan></text><text x="472" y="928" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="472" dy="0">Link evidence refs;</tspan><tspan x="472" dy="21">prefer durable IDs</tspan></text><path d="M 600 904 H 630" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 626 897 L 640 904 L 626 911 Z" fill="#34d399"/><rect x="648" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="768" y="872" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="768" dy="0">Order by event</tspan><tspan x="768" dy="26">time</tspan></text><text x="768" y="928" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="768" dy="0">Use occurred_at;</tspan><tspan x="768" dy="21">tie-break with seq</tspan></text><path d="M 896 904 H 926" stroke="#fbbf24" stroke-width="3" fill="none"/><path d="M 922 897 L 936 904 L 922 911 Z" fill="#fbbf24"/><rect x="944" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#fbbf24" stroke-width="2"/><text x="1064" y="885" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="middle"><tspan x="1064" dy="0">Mark uncertainty</tspan></text><text x="1064" y="915" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="1064" dy="0">Record confidence and</tspan><tspan x="1064" dy="21">any known skew</tspan></text><path d="M 1192 904 H 1222" stroke="#34d399" stroke-width="3" fill="none"/><path d="M 1218 897 L 1232 904 L 1218 911 Z" fill="#34d399"/><rect x="1240" y="844" width="240" height="120" rx="14" fill="#121c31" stroke="#34d399" stroke-width="2"/><text x="1360" y="872" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle"><tspan x="1360" dy="0">Reconcile and</tspan><tspan x="1360" dy="26">verify</tspan></text><text x="1360" y="928" font-size="17" font-weight="400" fill="#c9d4e8" text-anchor="middle"><tspan x="1360" dy="0">Cross-check each entry</tspan><tspan x="1360" dy="21">with external proof</tspan></text></svg>