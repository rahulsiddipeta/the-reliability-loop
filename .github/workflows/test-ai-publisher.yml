name: Test AI Article Publisher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Generate one test article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: python scripts/publish.py --batch 1

      - name: Validate Astro build
        run: npm run build

      - name: Upload generated article and diagram
        uses: actions/upload-artifact@v4
        with:
          name: ai-article-test
          path: |
            src/content/articles/
            public/images/articles/
          retention-days: 7
